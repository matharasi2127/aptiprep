<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aptitude Practice | AptiPrep</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/quiz.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

<header class="navbar">

    <div class="nav-content">

        <a href="index.html" class="logo">
            <img src="assets/aptiprep-logo.svg" alt="AptiPrep - Learn, Practice, Grow" class="brand-logo">
        </a>

        <nav class="nav-links">
            <a href="dashboard.html">Dashboard</a>
            <a href="companies.html">Companies</a>
            <a href="topics.html">Topics</a>
            <a href="mock-test.html">Mock Tests</a>
        </nav>

        <a href="profile.html" class="btn btn-outline">
            👤 Profile
        </a>

    </div>

</header>


<main>

<section class="quiz-page">

    <div class="container">

        <!-- TOP BAR -->

        <div class="quiz-top">

            <a href="companies.html" class="back-link">
                ← Back to Companies
            </a>

            <div class="quiz-progress-text">
                Questions
                <span id="questionRange">-</span>
                of
                <span id="totalQuestions">0</span>
            </div>

        </div>


        <!-- QUIZ HEADER -->

        <div class="quiz-header">

            <div>

                <span class="badge" id="companyBadge">
                    COMPANY
                </span>

                <h1 id="topicName">
                    Aptitude Practice
                </h1>

            </div>

            <div class="score-box">

                <span>Score</span>

                <strong id="score">
                    0
                </strong>

            </div>

        </div>


        <!-- PROGRESS -->

        <div class="progress-container">

            <div
                id="progressBar"
                class="progress-bar"
            ></div>

        </div>


        <!-- QUESTION CARD -->

        <div id="questionsContainer" class="topic-questions"></div>

        <nav id="topicPagination" class="topic-pagination" aria-label="Topic question pages" hidden>
            <button id="topicPreviousPage" class="topic-page-control" type="button" aria-label="Previous page">
                Prev
            </button>
            <button id="topicRetryPage" class="topic-page-control topic-retry-page" type="button" aria-label="Retry this page" title="Retry this page">
                ↻
            </button>
            <div id="topicPageNumbers" class="topic-page-numbers"></div>
            <button id="topicNextPage" class="topic-page-control" type="button" aria-label="Next page">
                Next
            </button>
            <button id="topicViewResult" class="topic-page-control topic-view-result" type="button" hidden>
                View Result
            </button>
        </nav>


    </div>

</section>

</main>


<script src="./js/topic.js?v=3"></script>

<script src="js/theme.js"></script>
</body>

</html>
