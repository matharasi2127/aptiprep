<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>History | AptiPrep</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

<header class="navbar">

    <div class="nav-content">

        <a href="index.html" class="logo">
            <img src="assets/aptiprep-logo.svg" alt="AptiPrep - Learn, Practice, Grow" class="brand-logo">
        </a>

        <a href="dashboard.html" class="btn btn-outline">
            Dashboard
        </a>

    </div>

</header>


<section class="page-header">

    <div class="container">

        <span class="badge">YOUR ACTIVITY</span>

        <h1>Practice History 🕘</h1>

        <p>
            Track all your previous practice sessions.
        </p>

    </div>

</section>


<section class="section">

    <div class="container">

        <div class="table-wrapper">

            <table class="data-table">

                <thead>

                    <tr>
                        <th>Company</th>
                        <th>Topic</th>
                        <th>Score</th>
                        <th>Accuracy</th>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>

                </thead>

                <tbody>

                    <tr>
                        <td>TCS</td>
                        <td>Number System</td>
                        <td>8/10</td>
                        <td>80%</td>
                        <td>Today</td>
                        <td class="status-success">Completed</td>
                    </tr>

                    <tr>
                        <td>Zoho</td>
                        <td>Percentage</td>
                        <td>7/10</td>
                        <td>70%</td>
                        <td>Yesterday</td>
                        <td class="status-success">Completed</td>
                    </tr>

                    <tr>
                        <td>Infosys</td>
                        <td>Probability</td>
                        <td>4/10</td>
                        <td>40%</td>
                        <td>Sep 10</td>
                        <td class="status-danger">Needs Practice</td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</section>

<script src="js/theme.js"></script>
</body>
</html>
