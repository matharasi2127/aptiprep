<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bookmarks | AptiPrep</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

<header class="navbar">

    <div class="nav-content">

        <a href="index.html" class="logo">
            <img src="assets/aptiprep-logo.svg" alt="AptiPrep - Learn, Practice, Grow" class="brand-logo">
        </a>

        <a href="dashboard.html" class="btn btn-outline">
            Dashboard
        </a>

    </div>

</header>


<section class="page-header">

    <div class="container">

        <span class="badge">SAVED QUESTIONS</span>

        <h1>My Bookmarks 🔖</h1>

        <p>
            Questions you saved for later revision.
        </p>

    </div>

</section>


<section class="section">

    <div class="container">

        <div class="panel">

            <div class="panel-header">
                <h2>Saved Questions</h2>
                <span class="tag">3 Questions</span>
            </div>

            <div class="practice-item">

                <div class="practice-icon">🔢</div>

                <div class="practice-info">
                    <h4>Number System Question</h4>
                    <p>TCS • Number System</p>
                </div>

                <a href="question.html" class="btn btn-primary">
                    Practice
                </a>

            </div>


            <div class="practice-item">

                <div class="practice-icon">💯</div>

                <div class="practice-info">
                    <h4>Percentage Question</h4>
                    <p>Zoho • Percentage</p>
                </div>

                <a href="question.html" class="btn btn-primary">
                    Practice
                </a>

            </div>


            <div class="practice-item">

                <div class="practice-icon">🎲</div>

                <div class="practice-info">
                    <h4>Probability Question</h4>
                    <p>Infosys • Probability</p>
                </div>

                <a href="question.html" class="btn btn-primary">
                    Practice
                </a>

            </div>

        </div>

    </div>

</section>

<script src="js/theme.js"></script>
</body>
</html>
