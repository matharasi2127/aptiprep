<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Challenge | AptiPrep</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

    <style>

        body {
            background: #f5f7fb;
        }

        .daily-container {
            max-width: 900px;
            margin: 60px auto;
            padding: 20px;
        }

        /* =========================
           INTRO SCREEN
        ========================= */

        .challenge-intro {
            background: white;
            border-radius: 20px;
            padding: 50px 30px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .challenge-icon {
            font-size: 70px;
            margin-bottom: 15px;
        }

        .challenge-intro h1 {
            font-size: 36px;
            margin-bottom: 12px;
            color: #111827;
        }

        .challenge-intro p {
            color: #6b7280;
            font-size: 17px;
            margin-bottom: 30px;
        }

        .challenge-info {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .info-box {
            background: #f3f4ff;
            border-radius: 14px;
            padding: 18px 25px;
            min-width: 130px;
        }

        .info-box strong {
            display: block;
            font-size: 24px;
            color: #4f46e5;
            margin-bottom: 5px;
        }

        .info-box span {
            color: #6b7280;
            font-size: 14px;
        }

        .start-btn {
            border: none;
            background: #4f46e5;
            color: white;
            padding: 14px 35px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
        }

        .start-btn:hover {
            background: #4338ca;
        }

        /* =========================
           QUESTION SCREEN
        ========================= */

        .question-screen {
            display: none;
        }

        .daily-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .daily-title {
            font-size: 30px;
            color: #111827;
        }

        .timer {
            background: #4f46e5;
            color: white;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
        }

        .progress {
            margin-bottom: 20px;
            color: #6b7280;
            font-weight: 600;
        }

        .question-card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        .question-number {
            color: #4f46e5;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 21px;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .option {
            border: 2px solid #e5e7eb;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option:hover {
            border-color: #4f46e5;
        }

        .option.selected {
            background: #ede9fe;
            border-color: #4f46e5;
            color: #4338ca;
        }

        .option.correct {
            background: #dcfce7;
            border-color: #22c55e;
            color: #166534;
        }

        .option.wrong {
            background: #fee2e2;
            border-color: #ef4444;
            color: #991b1b;
        }

        .button-area {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }

        .submit-btn,
        .next-btn {
            border: none;
            background: #4f46e5;
            color: white;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .next-btn {
            display: none;
        }

        .submit-btn:hover,
        .next-btn:hover {
            background: #4338ca;
        }

        .answer-message {
            margin-top: 20px;
            font-size: 17px;
            font-weight: 600;
        }

        .explanation {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: #f3f4f6;
            border-radius: 10px;
            line-height: 1.6;
        }

        .source {
            margin-top: 15px;
            font-size: 13px;
            color: #6b7280;
        }

        /* =========================
           COMPLETED
        ========================= */

        .completed {
            display: none;
            background: white;
            text-align: center;
            padding: 50px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .completed h2 {
            font-size: 32px;
            color: #111827;
        }

        .final-score {
            font-size: 45px;
            font-weight: bold;
            color: #4f46e5;
            margin: 20px 0;
        }

    </style>
</head>

<body>

    <!-- =========================
         NAVBAR
    ===============

        </div>

    </header>


    <!-- =========================
         MAIN CONTAINER
    ========================= -->

    <div class="daily-container">


        <!-- =========================
             INTRO SCREEN
        ========================= -->

        <div id="introScreen" class="challenge-intro">

            <div class="challenge-icon">
                🔥
            </div>

            <h1>
                Daily Challenge
            </h1>

            <p>
                Test your aptitude skills with today's
                random challenge!
            </p>


            <div class="challenge-info">

                <div class="info-box">
                    <strong>5</strong>
                    <span>Questions</span>
                </div>

                <div class="info-box">
                    <strong>5:00</strong>
                    <span>Time Limit</span>
                </div>

                <div class="info-box">
                    <strong>Random</strong>
                    <span>Questions</span>
                </div>

            </div>


            <button
                id="startChallengeBtn"
                class="start-btn">

                🚀 Start Today's Challenge

            </button>

        </div>


        <!-- =========================
             QUESTION SCREEN
        ========================= -->

        <div
            id="questionScreen"
            class="question-screen">

            <div class="daily-top">

                <h1 class="daily-title">
                    Daily Challenge 🔥
                </h1>

                <div
                    id="timer"
                    class="timer">

                    05:00

                </div>

            </div>


            <div
                id="progress"
                class="progress">

                Question 1 / 5

            </div>


            <div id="dailyContainer">

                <!-- Question inserted by JS -->

            </div>

        </div>


        <!-- =========================
             COMPLETED SCREEN
        ========================= -->

        <div
            id="completedScreen"
            class="completed">

            <h2>
                🎉 Challenge Completed!
            </h2>

            <div
                id="finalScore"
                class="final-score">

                0 / 5

            </div>

            <p>
                Come back tomorrow for a new challenge!
            </p>

        </div>

    </div>


    <script src="./js/daily-challenge.js"></script>

<script src="js/theme.js"></script>
</body>

</html>
