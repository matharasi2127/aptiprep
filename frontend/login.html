<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AptiPrep - Login</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/auth.css"
    >

</head>


<body>

    <div class="auth-page">

        <div class="auth-card">


            <div class="auth-logo">
                <img src="assets/aptiprep-logo.svg" alt="AptiPrep - Learn, Practice, Grow" class="brand-logo">
            </div>


            <h1>
                Welcome Back
            </h1>


            <p class="auth-subtitle">
                Login to continue your placement preparation
            </p>


            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- ERROR -->

                <div
                    id="loginError"
                    class="auth-error"
                ></div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    id="loginBtn"
                    class="auth-btn"
                >
                    Login
                </button>


            </form>


            <div class="auth-footer">

                <p>

                    Don't have an account?

                    <a href="register.html">
                        Create Account
                    </a>

                </p>

            </div>


        </div>

    </div>


    <script src="./js/login.js"></script>

<script src="js/theme.js"></script>
</body>

</html>
