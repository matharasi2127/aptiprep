<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Company | AptiPrep</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/company.css"
    >

    <link
        rel="stylesheet"
        href="css/responsive.css"
    >

</head>


<body>


<header class="navbar">

    <div class="nav-content">

        <a
            href="index.html"
            class="logo"
        >

            <img src="assets/aptiprep-logo.svg" alt="AptiPrep - Learn, Practice, Grow" class="brand-logo">

        </a>


        <nav class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="companies.html">
                Companies
            </a>

            <a href="topics.html">
                Topics
            </a>

            <a href="mock-test.html">
                Mock Tests
            </a>

        </nav>


        <a
            href="profile.html"
            class="btn btn-outline"
        >
            👤 Profile
        </a>

    </div>

</header>



<!-- COMPANY HERO -->

<section class="company-hero">

    <div class="container">

        <a
            href="companies.html"
            class="back-link"
        >
            ← Back to Companies
        </a>


        <div class="company-hero-content">


            <!-- LOGO -->

            <div class="company-hero-logo">

                <img
                    id="companyLogo"
                    src="assets/company-logos/default.png"
                    alt="Company Logo"
                >

            </div>


            <!-- COMPANY INFO -->

            <div class="company-hero-info">

                <span class="badge">
                    COMPANY APTITUDE
                </span>


                <h1 id="companyName">
                    Loading...
                </h1>


                <p id="companyDescription">
                    Loading company details...
                </p>


                <div class="company-stats">

                    <div class="stat-box">

                        <strong id="topicCount">
                            0
                        </strong>

                        <span>
                            Topics
                        </span>

                    </div>


                    <div class="stat-box">

                        <strong id="questionCount">
                            0
                        </strong>

                        <span>
                            Questions
                        </span>

                    </div>


                    <div class="stat-box">

                        <strong>
                            MCQ
                        </strong>

                        <span>
                            Practice
                        </span>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>



<!-- TOPICS -->

<section class="section">

    <div class="container">

        <span class="badge">
            APTITUDE TOPICS
        </span>


        <h2>
            Choose a Topic
        </h2>


        <p>
            Select a topic and practice
            company-focused aptitude questions.
        </p>


        <div
            id="topicsContainer"
            class="topic-grid"
        >

            <div class="loading-message">
                Loading topics...
            </div>

        </div>

    </div>

</section>



<script src="js/company.js"></script>

<script src="js/theme.js"></script>
</body>

</html>
