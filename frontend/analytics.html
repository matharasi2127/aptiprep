<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profile | AptiPrep</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

<header class="navbar">

    <div class="nav-content">

        <a href="index.html" class="logo">
            <img src="assets/aptiprep-logo.svg" alt="AptiPrep - Learn, Practice, Grow" class="brand-logo">
        </a>

        <a href="dashboard.html" class="btn btn-outline">
            Dashboard
        </a>

    </div>

</header>


<section class="page-header">

    <div class="container">

        <span class="badge">ACCOUNT</span>

        <h1>My Profile 👤</h1>

        <p>
            Manage your AptiPrep profile.
        </p>

    </div>

</section>


<section class="section">

    <div class="container">

        <div class="profile-card">

            <div class="profile-header">

                <div class="profile-avatar">
                    M
                </div>

                <div>
                    <h2>Matharasi</h2>
                    <p style="color:var(--text);">
                        Placement Aspirant
                    </p>
                </div>

            </div>


            <div class="form-group">
                <label>Full Name</label>
                <input type="text" value="Matharasi">
            </div>


            <div class="form-group">
                <label>Email</label>
                <input type="email" value="student@example.com">
            </div>


            <div class="form-group">
                <label>Target Role</label>

                <select>
                    <option>Aspiring Software Developer</option>
                    <option>Software Engineer</option>
                    <option>Full Stack Developer</option>
                </select>

            </div>


            <button class="btn btn-primary">
                Save Changes
            </button>

        </div>

    </div>

</section>

<script src="js/theme.js"></script>
</body>
</html>
