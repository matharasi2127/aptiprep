<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AptiPrep - Register</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <link
        rel="stylesheet"
        href="css/auth.css"
    >

</head>


<body>

    <div class="auth-page">

        <div class="auth-card">


            <!-- LOGO -->

            <div class="auth-logo">
                <img src="assets/aptiprep-logo.svg" alt="AptiPrep - Learn, Practice, Grow" class="brand-logo">
            </div>


            <!-- TITLE -->

            <h1>
                Create Account
            </h1>


            <p class="auth-subtitle">
                Start your placement preparation today 🚀
            </p>


            <!-- REGISTER FORM -->

            <form id="registerForm">


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- ERROR -->

                <div
                    id="registerError"
                    class="auth-error"
                ></div>


                <!-- SUCCESS -->

                <div
                    id="registerSuccess"
                    class="auth-success"
                ></div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    id="registerBtn"
                    class="auth-btn"
                >
                    Create Account
                </button>


            </form>


            <!-- LOGIN -->

            <div class="auth-footer">

                <p>

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>

            </div>


        </div>

    </div>


    <!-- REGISTER JS -->

    <script src="./js/register.js"></script>

<script src="js/theme.js"></script>
</body>

</html>
